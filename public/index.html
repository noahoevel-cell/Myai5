<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>MyAI</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth"><div class="card"><div class="logo">M</div><h1>MyAI</h1><p>Deine persönliche KI.</p><div class="tabs"><button class="active" data-m="login">Anmelden</button><button data-m="register">Konto erstellen</button></div><form id="authForm"><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="pass" type="password" minlength="8" required></label><button class="primary" id="authBtn">Anmelden</button><div id="authErr"></div></form></div></div>
<div id="app" class="hidden"><header><b>MyAI</b><nav><button id="hist">Verlauf</button><button id="prof">Profil</button><button id="adm" class="hidden">Admin</button></nav></header><main><aside><div class="row"><b>Chats</b><button id="new">+ Neu</button></div><div id="chats"></div></aside><section><div class="head"><div><h2 id="title">Neuer Chat</h2><span id="plan">FREE</span></div><label>Antwortstil<select id="style"><option value="sachlich">Extrem sachlich</option><option value="locker">Locker</option><option value="formell">Formell</option><option value="einfuehlsam">Sehr einfühlsam</option><option value="erklaerend">Erklärend</option><option value="kurz">Kurz & direkt</option></select></label></div><div id="msgs"></div><div class="composer"><div class="tools"><button id="img">Bild erstellen</button><label>Bild analysieren<input id="vision" type="file" accept="image/*" hidden></label></div><form id="chatForm"><textarea id="input" placeholder="Nachricht an MyAI …"></textarea><button class="send">↑</button></form><small id="status"></small></div></section></main></div>
<div id="modal" class="hidden"><div class="modalcard"><button id="x">×</button><div id="body"></div></div></div><script src="/main.js"></script></body></html>
